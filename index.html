<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Chip-8 Interpreter</title>
  </head>
  <body>
    <input type="file" id="rom-input" accept=".ch8" />
    <div id="CHIP-8"></div>
    <script type="module">
      import init, { run_chip_8 } from "./pkg/chip_8.js";

      await init()
      document.getElementById("rom-input").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const buffer = await file.arrayBuffer();
        const rom_data = new Uint8Array(buffer);
        run_chip_8(rom_data);
        document.querySelector('#CHIP-8 canvas')?.focus();
      });
    </script>
  </body>
</html>
